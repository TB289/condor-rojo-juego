; Cóndor Rojo — Godot 4.7 export presets.
; Windows: build/windows/CondorRojo.exe (pck inside the exe).
; macOS: universal (arm64 + x86_64). display/high_res and application/high_res
;   are both set so Retina / hiDPI stays sharp. project.godot already has allow_hidpi.
; Icon: the project icon res://icon.svg. application/icon is empty on purpose.
; Linux is a sketch. Web exports without threads to docs/index.html for GitHub Pages
; (Pages cannot send COOP/COEP, so SharedArrayBuffer stays off). Install the web
; export templates from the editor before exporting. No installer and no store.
; Install the export templates in the editor before exporting. No installer and no store.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/CondorRojo.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
